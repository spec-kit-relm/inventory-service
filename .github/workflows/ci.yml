name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
      - name: vet
        run: go vet ./...
      - name: unit tests
        run: go test -race -coverprofile=cover.out ./...
      - name: domain coverage ≥ 80 % (BE-6)
        run: |
          go test -coverprofile=domain.out ./internal/domain/...
          pct=$(go tool cover -func=domain.out | awk '/^total:/ {gsub("%","",$3); print $3}')
          echo "domain coverage: $pct%"
          awk -v p="$pct" 'BEGIN { exit (p < 80) }'
